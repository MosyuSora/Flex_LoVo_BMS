# Hardware-only Kconfig, layered by build.ps1 -Hardware (see hw.overlay for the
# matching devicetree). Renode models no DMA controller, so the sim build must
# NOT enable these -- comm_diag falls back to uart_poll_out there.
#
# UART async + DMA: diagnostic SNAP is transmitted by DMA instead of a per-byte
# uart_poll_out busy-wait, freeing the comm_diag thread (priority 7) from
# spinning ~22ms per snapshot at 115200.
CONFIG_UART_ASYNC_API=y
CONFIG_DMA=y

# OTA:App 运行在 Bootloader 之后(BL 4KB + 头 1KB),镜像基址 0x08001400。
# 一旦启用,App 必须由 Bootloader 引导才能启动(不能再直接烧到 0x08000000 独立跑)。
CONFIG_FLASH_LOAD_OFFSET=0x1400
