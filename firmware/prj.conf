# 平台能力开关归 Kconfig;业务参数归 src/config/appconfig.h
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_CAN=y
# OTA:ENTER_OTA 命令用 sys_reboot() 冷复位到 Bootloader
CONFIG_REBOOT=y

# BQ76940 走软件 I2C(GPIO 位翻转,见 app.overlay 的 gpio-i2c 节点)。
# CONFIG_I2C_GPIO 不在此硬写:它在 devicetree 有 gpio-i2c 节点时 default y
# 自动开,仿真切到硬件 I2C overlay 时自动关,避免 Kconfig 冲突。
# 时钟延展保持默认开(真机 BQ 可能拉 SCL)。

CONFIG_MULTITHREADING=y
CONFIG_EVENTS=y
CONFIG_MAIN_STACK_SIZE=768
CONFIG_IDLE_STACK_SIZE=256
CONFIG_ISR_STACK_SIZE=768

CONFIG_HEAP_MEM_POOL_SIZE=0
CONFIG_TIMESLICING=n
CONFIG_LOG=n
CONFIG_ASSERT=n
CONFIG_BOOT_BANNER=n
CONFIG_BOOT_DELAY=0
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512

CONFIG_NEWLIB_LIBC=n
CONFIG_MINIMAL_LIBC=y

# 看门狗由 AuxiliaryTask 管理，只有预期任务心跳全部正常时才喂狗。
CONFIG_WATCHDOG=y
