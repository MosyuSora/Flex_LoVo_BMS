# Test-only deliberate watchdog expiry image.
CONFIG_BMS_TEST_TELEMETRY=y
CONFIG_BMS_TEST_SKIP_WATCHDOG_FEED=y
CONFIG_ASSERT=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=n
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
CONFIG_THREAD_ANALYZER_PRINT_THREAD_PRIORITY=y
CONFIG_THREAD_ANALYZER_RUN_UNLOCKED=n
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_RUNTIME_STATS=n
CONFIG_WATCHDOG=y
